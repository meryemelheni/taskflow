apiVersion: v1
kind: ServiceAccount
metadata: { name: analytics-service, namespace: taskflow }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service, namespace: taskflow, labels: { app: analytics-service } }
spec:
  selector: { app: analytics-service }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service, namespace: taskflow, labels: { app: analytics-service } }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service, tier: backend } }
    spec:
      serviceAccountName: analytics-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: analytics-service } } }
      containers:
        - name: analytics-service
          image: ghcr.io/OWNER/taskflow-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: JWT_SECRET } }
            - name: INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: INTERNAL_KEY } }
            - { name: DATABASE_URL, value: "postgres://taskflow:$(POSTGRES_PASSWORD)@postgres:5432/analytics_db" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 30 }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: analytics-service, namespace: taskflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: analytics-service }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: analytics-service, namespace: taskflow }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: analytics-service } }
