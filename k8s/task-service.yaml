apiVersion: v1
kind: ServiceAccount
metadata: { name: task-service, namespace: taskflow }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: task-service, namespace: taskflow, labels: { app: task-service } }
spec:
  selector: { app: task-service }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: task-service, namespace: taskflow, labels: { app: task-service } }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: task-service } }
  template:
    metadata: { labels: { app: task-service, tier: backend } }
    spec:
      serviceAccountName: task-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: task-service } } }
      containers:
        - name: task-service
          image: ghcr.io/OWNER/taskflow-task-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: MONGO_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: JWT_SECRET } }
            - name: INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: INTERNAL_KEY } }
            - { name: MONGO_URL, value: "mongodb://taskflow:$(MONGO_PASSWORD)@mongo:27017/tasks?authSource=admin" }
            - { name: ANALYTICS_URL, value: "http://analytics-service:8080" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 30 }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: task-service, namespace: taskflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: task-service }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: task-service, namespace: taskflow }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: task-service } }
