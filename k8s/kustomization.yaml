apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow
resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 11-mongo.yaml
  - auth-service.yaml
  - task-service.yaml
  - analytics-service.yaml
  - frontend.yaml
  - 90-ingress.yaml
  - 95-networkpolicies.yaml
# deploy.sh remplace OWNER par votre compte GitHub (images GHCR)
images:
  - { name: ghcr.io/OWNER/taskflow-auth-service, newTag: latest }
  - { name: ghcr.io/OWNER/taskflow-task-service, newTag: latest }
  - { name: ghcr.io/OWNER/taskflow-analytics-service, newTag: latest }
  - { name: ghcr.io/OWNER/taskflow-frontend, newTag: latest }
