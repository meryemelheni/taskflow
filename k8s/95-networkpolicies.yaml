# Zero-trust : tout est refusé en entrée, puis on ouvre le strict nécessaire
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: taskflow }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-frontend, namespace: taskflow }
spec:
  podSelector: { matchLabels: { app: frontend } }
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend-to-backends, namespace: taskflow }
spec:
  podSelector: { matchLabels: { tier: backend } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: frontend } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-tasks-to-analytics, namespace: taskflow }
spec:
  podSelector: { matchLabels: { app: analytics-service } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: task-service } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-postgres-from-services, namespace: taskflow }
spec:
  podSelector: { matchLabels: { app: postgres } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: auth-service } }
        - podSelector: { matchLabels: { app: analytics-service } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-mongo-from-tasks, namespace: taskflow }
spec:
  podSelector: { matchLabels: { app: mongo } }
  ingress:
    - from: [{ podSelector: { matchLabels: { app: task-service } } }]
      ports: [{ port: 27017 }]
