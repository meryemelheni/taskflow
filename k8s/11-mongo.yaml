apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: taskflow, labels: { app: mongo } }
spec:
  clusterIP: None
  selector: { app: mongo }
  ports: [{ port: 27017, name: mongo }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo, namespace: taskflow }
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo, tier: database } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mongo
          image: mongo:7
          args: ["--auth", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: taskflow }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: MONGO_PASSWORD } }
          readinessProbe: { exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }, initialDelaySeconds: 40, periodSeconds: 20, timeoutSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: local-path, resources: { requests: { storage: 2Gi } } }
