apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: taskflow }
data:
  init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE analytics_db;
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: taskflow-quota, namespace: taskflow }
spec:
  hard: { requests.cpu: "4", requests.memory: 4Gi, limits.cpu: "8", limits.memory: 8Gi, persistentvolumeclaims: "4" }
