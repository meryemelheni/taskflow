apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: taskflow, labels: { app: postgres } }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432, name: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: taskflow }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, tier: database } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: taskflow }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: taskflow-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "taskflow"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "taskflow"] }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: init, configMap: { name: postgres-init } }
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: local-path, resources: { requests: { storage: 2Gi } } }
