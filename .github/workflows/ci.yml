name: build-and-push
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: auth-service, ctx: services/auth-service }
          - { name: task-service, ctx: services/task-service }
          - { name: analytics-service, ctx: services/analytics-service }
          - { name: frontend, ctx: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: owner
        run: echo "v=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.ctx }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.v }}/taskflow-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.v }}/taskflow-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
